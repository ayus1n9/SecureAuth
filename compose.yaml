services:
  db:
    image: postgres:16-alpine
    container_name: secureauth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secureauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureauth_secure_dev_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-secureauth_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureauth} -d ${POSTGRES_DB:-secureauth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secureauth-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secureauth-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-secureauth}:${POSTGRES_PASSWORD:-secureauth_secure_dev_pass_123}@db:5432/${POSTGRES_DB:-secureauth_db}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change_in_production_min_32_bytes_entropy_key_12345}
      CSRF_SECRET: ${CSRF_SECRET:-change_in_production_min_32_bytes_entropy_key_12345}
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      COOKIE_SECURE: "false" # Set to true when running behind TLS/HTTPS reverse proxy
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - secureauth-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secureauth-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - secureauth-network

volumes:
  postgres_data:

networks:
  secureauth-network:
    driver: bridge
